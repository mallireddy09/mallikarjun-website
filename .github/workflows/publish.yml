name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.16.0 --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: npm run audit
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          PUBLIC_URL: /mallireddy09
      - run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:browser
      - run: cp build/index.html build/404.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: portfolio-build
          path: build/
          if-no-files-found: error
          retention-days: 1

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No checkout, npm install, or application code execution in this job.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portfolio-build
          path: build
      - name: Publish to the Pages repository
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: mallireddy09/mallireddy09
          publish_branch: gh-pages
          publish_dir: ./build
